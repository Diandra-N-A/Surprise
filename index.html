<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Reva! 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-pastel: #FFD1DC;
            --white-soft: #FFFFFF;
            --text-color: #A67B84;
            --accent-pink: #FF91A4;
            --light-pink: #FFF0F3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--white-soft);
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        /* ASCII Container - Ukuran dijaga sesuai keinginanmu */
        #ascii-container {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            font-size: 2.2vw; 
            line-height: 1.1;
            color: var(--accent-pink);
            margin-top: 20px;
            font-weight: bold;
            min-height: 300px;
        }

        @media (max-width: 600px) {
            #ascii-container {
                font-size: 8px; 
            }
        }

        .content {
            padding: 0 25px 60px 25px;
            max-width: 500px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease-out;
        }

        .content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem; 
            margin-bottom: 20px;
            color: var(--accent-pink);
        }

        .message-box {
            background-color: var(--light-pink);
            padding: 35px 25px; 
            border-radius: 30px;
            border: 2px dashed var(--pink-pastel);
            box-shadow: 0 10px 30px rgba(255, 145, 164, 0.1);
        }


        p {
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: 500;
            margin: 0;
        }

        #surprise-btn {
            margin-top: 35px;
            padding: 18px 45px;
            background-color: var(--accent-pink);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 5px 20px rgba(255, 145, 164, 0.4);
            transition: all 0.3s ease;
        }

        #surprise-btn:active {
            transform: scale(0.95);
        }

        .heart {
            position: fixed;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 1000;
            animation: moveUp 4s linear forwards;
        }

        @keyframes moveUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ascii-container"></div>

    <div class="content" id="main-content">
        <h1>Happy 22nd, Cayang 🎂</h1>
        <div class="message-box">
            <p id="typed-text"></p>
        </div>
        <button id="surprise-btn" onclick="rainHearts()">Press Me 💗</button>
    </div>

    <script>
        const bouquet = document.getElementById('ascii-source').innerText;
        const message = "You’re officially 22 now! Still cute, still chaotic, still my favorite person (ever). Thanks for being my safe place and my daily dose of serotonin. Life’s way better with you in it. Love you always 💗";

        const asciiElement = document.getElementById('ascii-container');
        const textElement = document.getElementById('typed-text');
        const contentDiv = document.getElementById('main-content');
        const btn = document.getElementById('surprise-btn');

        let i = 0;
        let j = 0;

        function typeAscii() {
            if (i < bouquet.length) {
                asciiElement.textContent += bouquet.charAt(i);
                i++;
                setTimeout(typeAscii, 2); 
            } else {
                contentDiv.classList.add('visible');
                setTimeout(typeMessage, 800);
            }
        }

        function typeMessage() {
            if (j < message.length) {
                textElement.textContent += message.charAt(j);
                j++;
                setTimeout(typeMessage, 40);
            } else {
                btn.style.display = "inline-block";
            }
        }

        function rainHearts() {
            for (let k = 0; k < 40; k++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    const items = ['🌸', '💗', '✨', '🌹', '🎀'];
                    heart.innerHTML = items[Math.floor(Math.random() * items.length)];
                    heart.style.left = Math.random() * 100 + "vw";
                    heart.style.bottom = "-10vh";
                    heart.style.fontSize = (Math.random() * 15 + 25) + "px";
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, k * 80);
            }
        }

        window.onload = () => {
            setTimeout(typeAscii, 500);
        };
    </script>
